<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emily & Tomas — Photo Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="site-header">
  <h1 class="couple-names">Emily <span class="amp">&amp;</span> Tomas</h1>
  <p class="tagline">Every photo our guests have shared, in one place</p>
  <nav class="site-nav">
    <a href="/">Upload</a>
    <a href="/gallery.html" class="active">Gallery</a>
  </nav>
</header>

<main class="gallery-page">
  <p id="emptyState" class="empty-state" hidden>No photos yet — be the first to share one!</p>
  <div id="grid" class="grid"></div>
</main>

<div id="lightbox" class="lightbox" hidden>
  <button class="lightbox-close" id="lightboxClose" aria-label="Close">✕</button>
  <button class="lightbox-nav prev" id="lightboxPrev" aria-label="Previous">‹</button>
  <figure class="lightbox-figure">
    <img id="lightboxImg" alt="">
    <figcaption id="lightboxCaption"></figcaption>
  </figure>
  <button class="lightbox-nav next" id="lightboxNext" aria-label="Next">›</button>
  <a id="lightboxDownload" class="lightbox-download" download>Download</a>
</div>

<script src="/gallery.js"></script>
</body>
</html>
