<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#B85C38">
<title>Emily &amp; Tomas — Photo Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <a href="/" class="back-btn" aria-label="Back">‹</a>
  <h1 class="topbar-title">Gallery</h1>
</header>

<main class="gallery-content">
  <p id="emptyState" class="empty-state" hidden>No photos yet — be the first to share one!</p>
  <div id="grid" class="grid"></div>
  <div id="sentinel" class="grid-sentinel"></div>
</main>

<div id="viewer" class="viewer" hidden>
  <div class="viewer-topbar">
    <button class="viewer-icon-btn" id="viewerClose" aria-label="Close">✕</button>
  </div>
  <button class="viewer-nav prev" id="viewerPrev" aria-label="Previous">‹</button>
  <figure class="viewer-figure" id="viewerFigure">
    <img id="viewerImg" alt="">
  </figure>
  <button class="viewer-nav next" id="viewerNext" aria-label="Next">›</button>
  <div class="viewer-bottom">
    <p class="viewer-caption" id="viewerCaption"></p>
    <button type="button" class="viewer-download-btn" id="viewerDownload">Download</button>
  </div>
</div>

<script src="/gallery.js"></script>
</body>
</html>
