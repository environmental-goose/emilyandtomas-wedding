<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#9C3B32">
<title>Emily &amp; Tomas — Photo Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Parisienne&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <a href="/" class="back-btn" aria-label="Back">‹</a>
  <h1 class="topbar-title">Gallery</h1>
</header>

<main class="gallery-content">
  <p id="emptyState" class="empty-state" hidden>No photos yet — be the first to share one!</p>
  <div id="grid" class="grid"></div>
  <div id="sentinel" class="grid-sentinel"></div>
</main>

<div id="viewer" class="viewer" hidden>
  <div class="viewer-topbar">
    <button class="viewer-icon-btn" id="viewerClose" aria-label="Exit photo view">Exit</button>
  </div>
  <button class="viewer-nav prev" id="viewerPrev" aria-label="Previous">‹</button>

  <div class="viewer-track" id="viewerTrack">
    <figure class="viewer-slide" data-slot="prev">
      <img class="slide-thumb" alt="">
      <img class="slide-full" alt="" hidden>
      <video class="slide-full-video" playsinline webkit-playsinline muted hidden></video>
      <div class="slide-loading" hidden><span class="spinner" aria-hidden="true"></span><span>Loading…</span></div>
    </figure>
    <figure class="viewer-slide" data-slot="current">
      <img class="slide-thumb" alt="">
      <img class="slide-full" alt="" hidden>
      <video class="slide-full-video" controls playsinline webkit-playsinline hidden></video>
      <div class="slide-loading" hidden><span class="spinner" aria-hidden="true"></span><span>Loading…</span></div>
    </figure>
    <figure class="viewer-slide" data-slot="next">
      <img class="slide-thumb" alt="">
      <img class="slide-full" alt="" hidden>
      <video class="slide-full-video" playsinline webkit-playsinline muted hidden></video>
      <div class="slide-loading" hidden><span class="spinner" aria-hidden="true"></span><span>Loading…</span></div>
    </figure>
  </div>

  <p class="viewer-caption" id="viewerCaption"></p>

  <button class="viewer-nav next" id="viewerNext" aria-label="Next">›</button>
  <div class="viewer-bottom">
    <button type="button" class="viewer-arrow-btn" id="viewerPrevBtn" aria-label="Previous photo">‹</button>
    <button type="button" class="viewer-download-btn" id="viewerDownload">Download</button>
    <button type="button" class="viewer-arrow-btn" id="viewerNextBtn" aria-label="Next photo">›</button>
  </div>
</div>

<script src="/gallery.js"></script>
</body>
</html>
