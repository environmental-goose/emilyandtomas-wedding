<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#9C3B32">
<title>Emily &amp; Tomas — Upload Photos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Parisienne&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.jsdelivr.net/npm/exifr/dist/lite.umd.js"></script>
</head>
<body>
<header class="topbar">
  <a href="/" class="back-btn" aria-label="Back">‹</a>
  <h1 class="topbar-title">Upload Photos</h1>
</header>

<main class="page-content">
  <section class="card">
    <label class="field">
      <span>Your name</span>
      <input type="text" id="guestName" placeholder="e.g. Alex Smith" autocomplete="name">
    </label>

    <input type="file" id="fileInput" accept="image/*" multiple hidden>
    <button type="button" id="chooseBtn" class="cta-btn">Choose Photos</button>
  </section>
</main>

<div id="uploadModal" class="modal-backdrop" hidden>
  <div class="modal-card">
    <div class="modal-icon" id="modalIcon">↑</div>
    <h2 id="modalTitle">Uploading photos…</h2>
    <p class="modal-sub" id="modalSub">0 of 0 uploaded</p>
    <p class="modal-warning" id="modalWarning">Please don't leave this page until uploading is complete.</p>
    <div class="modal-progress-track">
      <div class="modal-progress-fill" id="modalProgressFill"></div>
    </div>
    <p class="modal-fail-note" id="modalFailNote" hidden></p>
    <div class="modal-actions" id="modalActions" hidden>
      <a href="/gallery" class="cta-btn">View Gallery</a>
      <button type="button" id="retryFailedBtn" class="secondary-btn" hidden>Retry failed</button>
    </div>
  </div>
</div>

<script src="/upload.js"></script>
</body>
</html>
