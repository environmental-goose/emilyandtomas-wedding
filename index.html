<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#9C3B32">
<title>Emily &amp; Tomas — Wedding Photos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Parisienne&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="landing">
  <svg class="landing-vine" viewBox="0 0 180 700" preserveAspectRatio="none" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <path id="leaf" d="M0 0 C 3 -9 12 -10 15 -2 C 12 6 3 8 0 0 Z"/>
      <g id="bloom">
        <circle cx="-7" cy="-3" r="6.2"/>
        <circle cx="7" cy="-3" r="6.2"/>
        <circle cx="0" cy="-11" r="6.2"/>
        <circle cx="-5.5" cy="6.5" r="6.2"/>
        <circle cx="5.5" cy="6.5" r="6.2"/>
        <circle cx="0" cy="0" r="3.6" fill="#6B4A34"/>
      </g>
    </defs>

    <path d="M24 690 C 4 620, 54 570, 30 480 C 8 400, 54 350, 28 270 C 6 200, 50 150, 26 80 C 14 40, 34 20, 30 4"
          stroke="#7C8562" stroke-width="3" stroke-linecap="round"/>
    <path d="M30 480 C 50 485, 68 492, 88 500" stroke="#7C8562" stroke-width="2" stroke-linecap="round"/>
    <path d="M28 270 C 55 255, 75 245, 92 232" stroke="#7C8562" stroke-width="2" stroke-linecap="round"/>
    <path d="M26 80 C 45 70, 60 62, 76 54" stroke="#7C8562" stroke-width="2" stroke-linecap="round"/>

    <use href="#leaf" fill="#7C8562" transform="translate(10,650) rotate(-20)"/>
    <use href="#leaf" fill="#94A176" transform="translate(45,600) rotate(150)"/>
    <use href="#leaf" fill="#7C8562" transform="translate(15,560) rotate(-140)"/>
    <use href="#leaf" fill="#94A176" transform="translate(50,500) rotate(30)"/>
    <use href="#leaf" fill="#7C8562" transform="translate(70,492) rotate(10) scale(0.85)"/>
    <use href="#leaf" fill="#94A176" transform="translate(15,430) rotate(-150)"/>
    <use href="#leaf" fill="#7C8562" transform="translate(45,380) rotate(50)"/>
    <use href="#leaf" fill="#94A176" transform="translate(12,340) rotate(-40)"/>
    <use href="#leaf" fill="#7C8562" transform="translate(72,248) rotate(15) scale(0.85)"/>
    <use href="#leaf" fill="#94A176" transform="translate(20,220) rotate(-155)"/>
    <use href="#leaf" fill="#7C8562" transform="translate(40,160) rotate(45)"/>
    <use href="#leaf" fill="#94A176" transform="translate(15,120) rotate(-35)"/>
    <use href="#leaf" fill="#7C8562" transform="translate(62,58) rotate(20) scale(0.85)"/>
    <use href="#leaf" fill="#94A176" transform="translate(28,28) rotate(-165)"/>

    <circle cx="20" cy="610" r="3" fill="#5F6A49"/>
    <circle cx="60" cy="350" r="3" fill="#5F6A49"/>
    <circle cx="35" cy="150" r="3" fill="#5F6A49"/>

    <use href="#bloom" fill="#D98F7F" transform="translate(35,15) scale(1.05)"/>
    <use href="#bloom" fill="#9C3B32" transform="translate(88,500) scale(0.95)"/>
    <use href="#bloom" fill="#D98F7F" transform="translate(90,229) scale(0.7)"/>
  </svg>

  <div class="landing-inner">
    <p class="landing-eyebrow">Celebrating</p>
    <h1 class="couple-names">Emily <span class="amp">&amp;</span> Tomas</h1>
    <p class="tagline">Thank you for celebrating with us! Share the photos you took, or browse what everyone else has shared.</p>
    <div class="landing-actions">
      <a class="landing-btn primary" href="/upload">
        <span>Upload Photos</span>
      </a>
      <a class="landing-btn" href="/gallery">
        <span>View Gallery</span>
      </a>
    </div>
  </div>
</main>
</body>
</html>
