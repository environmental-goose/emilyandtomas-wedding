<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#9C3B32">
<title>Emily &amp; Tomas — Wedding Photos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Parisienne&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="landing">
  <svg class="landing-flowers" viewBox="0 0 400 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <g id="pinkflower">
        <path d="M-4 10 C -12 13 -17 6 -12 0 C -8 4 -6 8 -4 10 Z" fill="#8B9A76"/>
        <circle cx="-9" cy="-4" r="8" fill="#E8AFC0"/>
        <circle cx="9" cy="-4" r="8" fill="#E8AFC0"/>
        <circle cx="0" cy="-13" r="8" fill="#E8AFC0"/>
        <circle cx="-7" cy="8" r="8" fill="#E8AFC0"/>
        <circle cx="7" cy="8" r="8" fill="#E8AFC0"/>
        <circle cx="0" cy="0" r="4.5" fill="#6B4A42"/>
      </g>
    </defs>
    <use href="#pinkflower" transform="translate(40,55) rotate(15) scale(0.8)"/>
    <use href="#pinkflower" transform="translate(340,40) rotate(-30) scale(1.1)"/>
    <use href="#pinkflower" transform="translate(200,120) rotate(60) scale(0.55)"/>
    <use href="#pinkflower" transform="translate(90,210) rotate(-10) scale(1.25)"/>
    <use href="#pinkflower" transform="translate(320,250) rotate(100) scale(0.85)"/>
    <use href="#pinkflower" transform="translate(30,330) rotate(200) scale(0.65)"/>
    <use href="#pinkflower" transform="translate(370,370) rotate(-60) scale(1.0)"/>
    <use href="#pinkflower" transform="translate(150,390) rotate(45) scale(0.5)"/>
    <use href="#pinkflower" transform="translate(250,460) rotate(160) scale(1.15)"/>
    <use href="#pinkflower" transform="translate(60,510) rotate(-120) scale(0.75)"/>
    <use href="#pinkflower" transform="translate(350,550) rotate(20) scale(0.6)"/>
    <use href="#pinkflower" transform="translate(180,600) rotate(-45) scale(1.05)"/>
    <use href="#pinkflower" transform="translate(20,670) rotate(80) scale(0.85)"/>
    <use href="#pinkflower" transform="translate(300,690) rotate(-15) scale(0.7)"/>
    <use href="#pinkflower" transform="translate(110,750) rotate(130) scale(0.95)"/>
    <use href="#pinkflower" transform="translate(370,790) rotate(-90) scale(0.55)"/>
    <use href="#pinkflower" transform="translate(200,840) rotate(35) scale(0.8)"/>
    <use href="#pinkflower" transform="translate(50,870) rotate(-150) scale(1.1)"/>
  </svg>

  <div class="landing-inner">
    <p class="landing-eyebrow">Celebrating</p>
    <h1 class="couple-names">Emily <span class="amp">&amp;</span> Tomas</h1>
    <p class="tagline">Thank you for celebrating with us! Share the photos you took, or browse what everyone else has shared.</p>
    <div class="landing-actions">
      <a class="landing-btn primary" href="/upload">
        <span>Upload Photos</span>
      </a>
      <a class="landing-btn" href="/gallery">
        <span>View Gallery</span>
      </a>
    </div>
  </div>
</main>
</body>
</html>
